name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      DOCKER_CREDENTIAL_SOURCE: ${{ secrets.DOCKERHUB_TOKEN != '' && 'DOCKERHUB_TOKEN' || 'DOCKER_PASSWORD' }}
      DOCKER_IMAGE: myfirstdockerapp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Missing Docker Hub credentials. Set DOCKERHUB_USERNAME/DOCKERHUB_TOKEN (preferred) or DOCKER_USERNAME/DOCKER_PASSWORD."
            echo "::error::Use a Docker Hub Personal Access Token with at least Read and Write permissions to avoid 'insufficient scopes' push failures."
            exit 1
          fi

          if [ "$DOCKER_CREDENTIAL_SOURCE" = "DOCKER_PASSWORD" ]; then
            echo "::warning::DOCKER_PASSWORD is deprecated. Prefer a Docker Hub access token in DOCKERHUB_TOKEN with Read and Write permissions."
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
